name: Firmware

on:
  push:
    branches: [main]
    paths:
      - '2.Firmware/HoloCubic-fw/**'
      - '3.Software/ImageToHolo/**'
      - '.github/workflows/firmware.yml'
  pull_request:
    paths:
      - '2.Firmware/HoloCubic-fw/**'
      - '3.Software/ImageToHolo/**'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FIRMWARE_DIR: 2.Firmware/HoloCubic-fw
  PYTHONUNBUFFERED: '1'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        board: [naive, ironman]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-6.1.18-${{ hashFiles('2.Firmware/HoloCubic-fw/platformio.ini') }}
      - run: python -m pip install platformio==6.1.18
      - run: pio run -d "$FIRMWARE_DIR" -e "${{ matrix.board }}"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: firmware-${{ matrix.board }}
          path: |
            2.Firmware/HoloCubic-fw/.pio/build/${{ matrix.board }}/firmware.bin
            2.Firmware/HoloCubic-fw/.pio/build/${{ matrix.board }}/bootloader.bin
            2.Firmware/HoloCubic-fw/.pio/build/${{ matrix.board }}/partitions.bin
          if-no-files-found: error

  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-6.1.18-${{ hashFiles('2.Firmware/HoloCubic-fw/platformio.ini') }}
      - run: python -m pip install platformio==6.1.18 -r 3.Software/ImageToHolo/requirements.txt
      - run: pio pkg install -d "$FIRMWARE_DIR" -e naive
      - run: sh "$FIRMWARE_DIR/test/imu_test/run.sh"
      - run: sh "$FIRMWARE_DIR/test/sd_card_test/run.sh"
      - run: sh "$FIRMWARE_DIR/test/lv_fs_test/run.sh"
      - run: python "$FIRMWARE_DIR/test/network_test/run_host_tests.py"
      - run: python "$FIRMWARE_DIR/test/gui_test/run.py"
      - run: python -m unittest discover -s 3.Software/ImageToHolo/test -v
