[platformio]
default_envs = naive
; Historical library snapshots in lib/ are retained for reference only.
lib_dir = components

[env]
platform = espressif32@8.0.0
board = pico32
framework = arduino
platform_packages =
    platformio/framework-arduinoespressif32@4.30312.261024
    platformio/framework-arduinoespressif32-esp32-libs@3.3.12
; The current WiFi/TLS/UI stack needs a 3 MiB application slot on 4 MiB flash.
board_build.partitions = huge_app.csv
monitor_speed = 115200
lib_deps =
    lvgl/lvgl@9.6.0
    bodmer/TFT_eSPI@2.5.43
    fastled/FastLED@3.10.8
    electroniccats/MPU6050@1.4.5
    bblanchon/ArduinoJson@7.4.3
build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    -include include/tft_setup.h

[env:naive]
build_flags =
    ${env.build_flags}
    -D RGB_LED_NUM=1

[env:ironman]
build_flags =
    ${env.build_flags}
    -D RGB_LED_NUM=2
